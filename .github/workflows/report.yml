name: banklab-report-and-pages

on:
  workflow_run:
    workflows: ["naver-bank-daily"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: banklab-report-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dashboard and statistical report
        run: python scripts/build_dashboard.py
      - name: Commit generated dashboard and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reports/latest.md reports/stock_stats.csv
          if git diff --cached --quiet; then
            echo "No changes to generated files."
          else
            git commit -m "report: refresh BANKLAB data and statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

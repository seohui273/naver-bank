name: banklab-report-and-pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report.yml'
      - 'scripts/collect_news_briefs.py'
      - 'banklab_v2.js'
      - 'banklab_insights.js'
      - 'banklab_explain.js'
      - 'index.html'
  workflow_run:
    workflows: ["naver-bank-daily"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: banklab-report-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install Korean chart font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Install report libraries
        run: python -m pip install pandas numpy matplotlib jupyter ipykernel
      - name: Build dashboard and statistical report
        run: |
          python scripts/build_dashboard.py
          python banklab_upgrade_home.py
      - name: Refresh source-linked bank news snippets
        run: python scripts/collect_news_briefs.py
      - name: Render reproducible Quarto report
        run: |
          quarto render reports/report.qmd --to html --output research.html
          echo "Quarto output paths:"
          find . -maxdepth 4 -type f -name 'research.html' -print
          # Quarto currently writes ../research.html relative to reports/report.qmd.
          # Normalize root-level output and its companion assets into reports/.
          if [ -s research.html ]; then
            mv -f research.html reports/research.html
          fi
          if [ -d research_files ]; then
            rm -rf reports/research_files
            mv research_files reports/research_files
          fi
          if [ -d report_files ]; then
            rm -rf reports/report_files
            mv report_files reports/report_files
          fi
          echo "Normalized output:"
          ls -lah reports/ | head -30
          test -s reports/research.html
      - name: Commit generated dashboard and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reports/latest.md reports/stock_stats.csv bank_data/news_briefs.json
          if git diff --cached --quiet; then
            echo "No changes to generated files."
          else
            git commit -m "report: update BANKLAB dashboard and Quarto research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare Pages site
        run: |
          mkdir -p _site/research
          cp index.html _site/index.html
          cp banklab_v2.js _site/banklab_v2.js
          cp banklab_insights.js _site/banklab_insights.js
          cp banklab_explain.js _site/banklab_explain.js
          mkdir -p _site/bank_data
          cp bank_data/news_briefs.json _site/bank_data/news_briefs.json
          test -s reports/research.html
          cp reports/research.html _site/research/index.html
          cp reports/research_krx.html _site/research_krx.html
          if [ -d reports/research_files ]; then
            cp -a reports/research_files _site/research/research_files
          fi
          # Quarto may generate linked assets under report_files instead.
          if [ -d reports/report_files ]; then
            cp -a reports/report_files _site/research/report_files
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
